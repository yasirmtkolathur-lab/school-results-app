<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Added SweetAlert2 & html2pdf.js -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">
  
  <!-- Theme Toggle -->
  <button id="themeToggle" class="absolute top-4 right-4 p-2 rounded-full bg-white dark:bg-gray-800 shadow-md hover:scale-105 transition-transform">
    <i class="ph ph-moon text-xl dark:hidden"></i>
    <i class="ph ph-sun text-xl hidden dark:block text-yellow-400"></i>
  </button>

  <!-- Search Card -->
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden" id="appContainer">
    <div class="bg-blue-600 dark:bg-blue-700 p-6 text-center text-white" id="headerSection">
      <i class="ph ph-graduation-cap text-5xl mb-2"></i>
      <h1 class="text-2xl font-bold">Exam Results</h1>
      <p class="text-sm opacity-80" id="headerSubtitle">Enter your credentials to check your marks</p>
    </div>
    
    <div class="p-6">
      <form id="resultForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Registration Number</label>
          <input type="text" id="regNo" required placeholder="e.g. 10425" 
            class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors flex justify-center items-center gap-2">
          <i class="ph ph-magnifying-glass"></i> Check Result
        </button>
      </form>

      <!-- Loader -->
      <div id="loader" class="hidden mt-6 text-center text-blue-600 dark:text-blue-400">
        <i class="ph ph-spinner animate-spin text-3xl"></i>
        <p class="text-sm mt-2">Fetching records...</p>
      </div>

      <!-- Result Display (This specific div will be converted to PDF) -->
      <div id="printableResult" class="hidden mt-6">
        <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg border dark:border-gray-600">
          <div class="border-b dark:border-gray-600 pb-3 mb-3">
            <h2 id="studentName" class="text-xl font-bold text-gray-900 dark:text-white"></h2>
            <p class="text-sm text-gray-500 dark:text-gray-300">Reg No: <span id="displayReg"></span> | Grade: <span id="displayGrade"></span></p>
          </div>
          
          <div id="marksContainer" class="space-y-2 mb-3">
            <!-- Marks injected via JS -->
          </div>
          
          <div class="pt-3 border-t dark:border-gray-600 flex justify-between items-end">
            <div>
              <p class="text-xs text-gray-500 dark:text-gray-400">Attendance: <span id="displayAttendance"></span></p>
              <p class="text-sm font-semibold mt-1">Class Rank: <span id="finalRank"></span></p>
            </div>
            <div class="text-right">
              <p class="text-lg font-bold">Total: <span id="totalMarks" class="text-blue-600 dark:text-blue-400"></span></p>
            </div>
          </div>
        </div>
      </div>

      <!-- PDF Download Button (Kept outside the printable area) -->
      <button id="downloadPdfBtn" class="hidden mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition-colors flex justify-center items-center gap-2">
        <i class="ph ph-download-simple"></i> Download PDF Result
      </button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
